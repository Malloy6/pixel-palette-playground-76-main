# nginx site configuration for Elimusphere
# Setup for elimusphere.co.ke and jitsi.elimusphere.co.ke
server {
  listen 80;
  server_name elimusphere.co.ke;

  # Redirect all HTTP to HTTPS; certbot will update this file for SSL when using --nginx
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# SSL server block will be inserted by certbot. If you prefer to manage certificates
# yourself, add a server block like below and replace the certificate paths.

server {
  listen 443 ssl http2;
  server_name elimusphere.co.ke;
  ssl_certificate /etc/letsencrypt/live/elimusphere.co.ke/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/elimusphere.co.ke/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    # server.mjs serves /assets, the logo, and favicon from the active build.
    # Proxying them avoids NGINX returning a 404 when its filesystem path is
    # stale or inaccessible after a deployment.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# Jitsi is served through Nginx because Nginx owns ports 80 and 443.
# Obtain the certificate for this hostname before enabling the HTTPS block.
server {
  listen 80;
  server_name jitsi.elimusphere.co.ke;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name jitsi.elimusphere.co.ke;
  ssl_certificate /etc/letsencrypt/live/jitsi.elimusphere.co.ke/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jitsi.elimusphere.co.ke/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Jitsi's config.js uses this same-origin URL for collaborative whiteboards.
  # Keep the Socket.IO backend private to localhost; clients connect via HTTPS.
  location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
